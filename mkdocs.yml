site_name: Calculator Service
site_description: User and contributor documentation for Calculator Service
site_url: https://bairaboinalokeshkumaryadav.github.io/calcservice-python/
repo_url: https://github.com/BairaboinaLokeshKumarYadav/calcservice-python
repo_name: BairaboinaLokeshKumarYadav/calcservice-python

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide: USER_GUIDE.md
  - Community: community.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
